name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Godot 4.6.1 and templates
        shell: pwsh
        run: ./tools/install-godot.ps1 -Destination "$env:RUNNER_TEMP/godot"
      - name: Headless validation
        shell: pwsh
        run: ./tests/run.ps1 -GodotPath "$env:RUNNER_TEMP/godot/Godot_v4.6.1-stable_win64_console.exe"
      - name: Export, test and package Windows64
        shell: pwsh
        run: ./tools/build-release.ps1 -GodotPath "$env:RUNNER_TEMP/godot/Godot_v4.6.1-stable_win64_console.exe" -TemplatePath "$env:RUNNER_TEMP/godot/4.6.1.stable"
      - name: Upload verified Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SynthwaveDrive-Windows64
          path: .godot/releases/SynthwaveDrive-Windows64.zip
          if-no-files-found: error
      - name: Keep build and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            .godot/validation/**/*.log
            .godot/releases/**/*.log
          if-no-files-found: ignore
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SynthwaveDrive-Windows64
          path: release
      - name: Attach package to tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/SynthwaveDrive-Windows64.zip --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
