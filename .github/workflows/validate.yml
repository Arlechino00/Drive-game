name: Validate Godot 4.6.1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot editor
        shell: pwsh
        run: |
          $url = 'https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_win64.exe.zip'
          curl.exe --location --fail --retry 2 --max-time 300 --output "$env:RUNNER_TEMP/godot.zip" $url
          if ($LASTEXITCODE -ne 0) { throw 'Godot download failed' }
          if ((Get-FileHash "$env:RUNNER_TEMP/godot.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne '088da0457e2d1f7f8a45e6d4605a42b756ea33b9ccd75059bdbc01bb31c2b40d') { throw 'Godot SHA256 mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
      - name: Headless gameplay and regression checks
        shell: pwsh
        run: ./tests/run.ps1 -GodotPath "$env:RUNNER_TEMP/godot/Godot_v4.6.1-stable_win64_console.exe" -TimeoutSeconds 180
      - name: Keep validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: .godot/validation/**/*.log
          if-no-files-found: ignore
